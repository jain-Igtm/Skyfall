name: Build Skyfall Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: skyfall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Skyfall
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run game-rule tests
        run: npm test

      - name: Build and synchronize Android
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
          npx cap add android
          npm run configure:android
          npx cap sync android
          chmod +x android/gradlew

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Skyfall-build-diagnostics
          path: build-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Compile installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Skyfall-Orison-9.apk
          sha256sum Skyfall-Orison-9.apk > Skyfall-Orison-9.apk.sha256

      - name: Upload Skyfall APK
        uses: actions/upload-artifact@v4
        with:
          name: Skyfall-Orison-9-Android
          path: |
            Skyfall-Orison-9.apk
            Skyfall-Orison-9.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skyfall-orison-9-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            Skyfall-Orison-9.apk \
            Skyfall-Orison-9.apk.sha256 \
            --title "Skyfall: Orison-9 Android build ${GITHUB_RUN_NUMBER}" \
            --notes "First playable Skyfall station build. Install Skyfall-Orison-9.apk on Android and play in landscape."
